<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Cute Date</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #ffeef2;
      text-align: center;
      padding: 50px 20px;
      overflow: hidden;
    }

    h1 {
      font-size: 28px;
      color: #b30059;
      margin-bottom: 10px;
    }

    .emoji {
      font-size: 50px;
      margin: 15px 0;
    }

    .subtitle {
      font-size: 20px;
      color: #555;
    }

    input[type="date"], input[type="time"] {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #ff99cc;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      background-color: #ff3385;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ff66a3;
    }

    #result {
      margin-top: 30px;
      font-size: 24px;
      color: #cc0066;
      font-weight: bold;
    }

    .bottom-btn {
      margin-top: 25px;
      background-color: #ff5e9c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Falling hearts */
    .heart {
      position: fixed;
      color: #ff4d88;
      font-size: 20px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Awww, My BOSS <span>❤️</span></h1>
  <div class="emoji">😘</div>

  <div class="subtitle">Let's go for a date! <span>💑</span></div>

  <input type="date" id="dateInput">
  <input type="time" id="timeInput">
  <br>
  <button onclick="setDate()">Perfect 💑</button>

  <div id="result"></div>

  <button class="bottom-btn" onclick="goToNextPage()">Let's go for a plan! 🌟</button>

  <script>
    function setDate() {
      const date = document.getElementById('dateInput').value;
      const time = document.getElementById('timeInput').value;
      
      if (date && time) {
        document.getElementById('result').innerHTML = `Can't wait for our date on <strong>${date} at ${time}</strong>! ❤️`;
      } else {
        document.getElementById('result').innerHTML = "Please choose a date and time!";
      }
    }

    // Heartfall animation
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    setInterval(createHeart, 300);

    // Redirect to another page when the "Let's go for a plan!" button is clicked
    function goToNextPage() {
      window.location.href = 'welcome.html';  // Change 'nextpage.html' to your desired page
    }
  </script>

</body>
</html>
