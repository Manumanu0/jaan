<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
  <style>
    body {
      background-color: #202124;
      color: white;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 100px;
    }

    .logo {
      font-size: 50px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #DB4437; }
    .logo span:nth-child(3) { color: #F4B400; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #0F9D58; }
    .logo span:nth-child(6) { color: #DB4437; }

    .search-bar {
      display: flex;
      align-items: center;
      background-color: #303134;
      border-radius: 24px;
      padding: 10px 20px;
      width: 90%;
      max-width: 600px;
      margin-bottom: 30px;
      cursor: pointer; /* Make it look clickable */
    }

    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      flex-grow: 1;
    }

    .search-bar .icon {
      color: #9aa0a6;
      font-size: 18px;
      margin-left: 10px;
    }

    .section-title {
      color: #9aa0a6;
      font-size: 16px;
      align-self: flex-start;
      margin-left: calc(50% - 300px);
      margin-bottom: 10px;
    }

    .trending {
      list-style: none;
      padding: 0;
      width: 90%;
      max-width: 600px;
    }

    .trending li {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #3c4043;
      font-size: 16px;
    }

    .trending li::before {
      content: '🔍';
      margin-right: 12px;
    }
  </style>
</head>
<body>

  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <div class="search-bar" onclick="openProTipPage()">
    <input type="text" id="searchInput" placeholder="Search Google or type a URL" />
    <span class="icon">🎤</span>
    <span class="icon">📷</span>
  </div>

  <div class="section-title">Trending searches</div>

  <ul class="trending">
    <li>Why is my bf so cute?</li>
    <li>Why does Rheina love him more?</li>
    <li>Rheina's birthdate (coz her bf forgets)</li>
  </ul>

  <script>
    // Function to open the "Pro Tip" page
    function openProTipPage() {
      window.location.href = 'google search.html'; // Redirect to the Pro Tip page
    }

    // Add an event listener to handle the search input submission (optional for the search bar)
    document.getElementById("searchInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const query = event.target.value;
        if (query.trim() !== "") {
          window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        }
      }
    });
  </script>

</body>
</html>
