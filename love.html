<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Timer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      /* Background image settings */
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                  url('lo.jpg') no-repeat center center;
      background-size: cover;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 44px;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    .labels {
      font-size: 18px;
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: -10px;
    }

    .labels div {
      width: 80px;
    }

    .counting-text {
      margin: 30px 0;
      font-size: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .next-button {
      background-color: rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 25px;
      border: 2px solid white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .next-button:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <h2>We've been together for:</h2>

  <div class="timer" id="timer">Loading...</div>

  <div class="labels">
    <div>Days</div>
    <div>Hours</div>
    <div>Minutes</div>
    <div>Seconds</div>
  </div>

  <div class="counting-text">... and still counting &lt;3</div>

  <button class="next-button" onclick="location.href='memories.html'">Next page →</button>

  <script>
    // Set your anniversary/start date here (YYYY-MM-DD)
    const startDate = new Date("2024-08-08T00:00:00");

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").innerHTML =
        `${days.toString().padStart(3, '0')} : ` +
        `${hours.toString().padStart(2, '0')} : ` +
        `${minutes.toString().padStart(2, '0')} : ` +
        `${seconds.toString().padStart(2, '0')}`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
